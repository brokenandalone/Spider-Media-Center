name: Validate Media Center

on:
  push:
    branches:
      - main
      - feature/bcn-network-ai-dj
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript
        run: |
          node --check electron/main.cjs
          node --check electron/preload.cjs
          node --check electron/renderer.js
          node --check electron/network-directory.cjs
          node --check electron/usb-dj.cjs
          node --check dist/media-center-upgrades.js
      - name: Install fixture decoder
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Playback and compatibility regressions
        run: npm test
      - name: Check native movie decoder
        run: node --check electron/media-compatibility.cjs
      - name: Check portable DJ Python
        run: python3 -m py_compile dj-usb/service/service.py
