name: Validate Media Center

on:
  push:
    branches:
      - main
      - feature/bcn-network-ai-dj
      - 'upgrades/**'
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript
        run: |
          node --check electron/main.cjs
          node --check electron/preload.cjs
          node --check electron/renderer.js
          node --check electron/network-directory.cjs
          node --check electron/nova-service.cjs
          node --check electron/bcn-desk.cjs
          node --check electron/bcn-listener-intake.cjs
          node --check electron/radio-telemetry.cjs
          node --check electron/radio-recovery.cjs
          node --check dist/assets/index-Dt0TTW2G.js
          node --check dist/media-center-upgrades.js
      - name: Validate one-command Spider OS installer
        run: |
          bash -n scripts/install-nova-bcn.sh
          bash -n scripts/install-media-center.sh
      - name: Install fixture decoder
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Playback and compatibility regressions
        run: npm test
      - name: Check native movie decoder
        run: node --check electron/media-compatibility.cjs
      - name: Install locked build dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Package verified Linux application upgrade
        run: |
          npm run package:linux
          bash release/install-media-center.sh --check
      - uses: actions/upload-artifact@v4
        with:
          name: Spider-Media-Center-Playback-Build
          path: release/
          if-no-files-found: error
